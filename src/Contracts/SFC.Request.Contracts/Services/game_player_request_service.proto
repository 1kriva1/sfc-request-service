syntax = "proto3";

package sfc_request;

import "Messages/Request/Game/Player/Get/get_game_player_request_request.proto";
import "Messages/Request/Game/Player/Get/get_game_player_request_response.proto";
import "Messages/Request/Game/Player/Find/get_game_player_requests_request.proto";
import "Messages/Request/Game/Player/Find/get_game_player_requests_response.proto";

option csharp_namespace = "SFC.Request.Contracts.Services";

service GamePlayerRequestService {
    rpc GetGamePlayerRequest(GetGamePlayerRequestRequest) returns (GetGamePlayerRequestResponse);
    rpc GetGamePlayerRequests(GetGamePlayerRequestsRequest) returns (GetGamePlayerRequestsResponse);
}