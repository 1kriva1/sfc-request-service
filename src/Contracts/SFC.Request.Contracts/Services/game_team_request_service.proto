syntax = "proto3";

package sfc_request;

import "Messages/Request/Game/Team/Get/get_game_team_request_request.proto";
import "Messages/Request/Game/Team/Get/get_game_team_request_response.proto";
import "Messages/Request/Game/Team/Find/get_game_team_requests_request.proto";
import "Messages/Request/Game/Team/Find/get_game_team_requests_response.proto";

option csharp_namespace = "SFC.Request.Contracts.Services";

service GameTeamRequestService {
    rpc GetGameTeamRequest(GetGameTeamRequestRequest) returns (GetGameTeamRequestResponse);
    rpc GetGameTeamRequests(GetGameTeamRequestsRequest) returns (GetGameTeamRequestsResponse);
}