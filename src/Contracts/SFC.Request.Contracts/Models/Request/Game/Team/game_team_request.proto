syntax = "proto3";

package sfc_request;

import "google/protobuf/wrappers.proto";

option csharp_namespace = "SFC.Request.Contracts.Models.Request.Game.Team";

message GameTeamRequest
{
    int64 id = 1;
    string user_id = 2;
    int64 game_id = 3;
    int64 team_id = 4;
    int32 status_id = 5;
    google.protobuf.StringValue game_comment = 6;
    string team_comment = 7;
}